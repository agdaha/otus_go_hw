{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "calendar.secretName" . }}
  labels:
    {{- include "calendar.labels" (dict "top" . "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ .Values.postgresql.auth.password | quote }}
  rabbit-password: {{ .Values.rabbitmq.auth.password | quote }}
{{- end }}
