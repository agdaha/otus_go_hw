{{- if .Values.scheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "calendar.fullname" . }}-scheduler
  labels:
    {{- include "calendar.labels" (dict "top" . "component" "scheduler") | nindent 4 }}
spec:
  replicas: {{ .Values.scheduler.replicaCount }}
  selector:
    matchLabels:
      {{- include "calendar.selectorLabels" (dict "top" . "component" "scheduler") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "calendar.selectorLabels" (dict "top" . "component" "scheduler") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/scheduler-configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- include "calendar.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "calendar.waitForPostgres" . | nindent 8 }}
        {{- include "calendar.waitForRabbitmq" . | nindent 8 }}
      containers:
        - name: scheduler
          image: {{ include "calendar.image" (dict "top" . "image" .Values.scheduler.image) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "calendar.postgresPasswordEnv" . | nindent 12 }}
            {{- include "calendar.rabbitPasswordEnv" . | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/calendar
              readOnly: true
          resources:
            {{- toYaml .Values.scheduler.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "calendar.fullname" . }}-scheduler-config
      {{- with .Values.scheduler.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.scheduler.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
